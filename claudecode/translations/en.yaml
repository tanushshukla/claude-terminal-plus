configuration:
  enable_mcp:
    name: Enable Home Assistant MCP
    description: >-
      Enable the Home Assistant MCP server for direct entity and service
      interaction from Claude Code. Allows Claude to query states, call services,
      and interact with your smart home.
  terminal_font_size:
    name: Terminal Font Size
    description: >-
      Font size for the web terminal in pixels (10-24).
      Adjust for readability on your display.
  terminal_theme:
    name: Terminal Theme
    description: >-
      Color theme for the web terminal.
      Choose 'dark' for dark backgrounds or 'light' for light backgrounds.
  working_directory:
    name: Working Directory
    description: >-
      The default working directory when Claude Code starts.
      Use /homeassistant for direct access to HA configuration files.
  session_persistence:
    name: Session Persistence
    description: >-
      Enable tmux session persistence. When enabled, your terminal session
      survives browser refreshes and disconnects. Recommended for long-running tasks.
  auto_continue:
    name: Auto-continue Claude on Start
    description: >-
      When the terminal starts, automatically run 'claude --continue' to resume
      your previous session instead of dropping into a shell. Only takes effect
      when Session Persistence is enabled. Safe with no prior session (starts fresh).
  auto_update_claude:
    name: Auto-update Claude Code
    description: >-
      Automatically check for and install Claude Code updates on app startup.
      Keeps Claude Code current without requiring app version bumps.
  guard_privileged_actions:
    name: Enforce Privileged-action Guard
    description: >-
      Enforce a safety boundary that blocks or asks before Claude runs
      destructive Home Assistant actions (stopping Core, disabling the Supervisor
      watchdog, rebooting or shutting down the host, OS updates) and requires
      human confirmation for a full restart. Enforced by the app, not just by
      instructions. Recommended on.
  disallow_actions:
    name: Blocked Actions
    description: >-
      Home Assistant actions Claude may never run on its own, as domain.service
      identifiers (for example homeassistant.stop, hassio.host_reboot). These are
      hard-blocked while the guard is enabled.
  confirm_actions:
    name: Confirm-first Actions
    description: >-
      Actions that require explicit human confirmation before running, as
      domain.service identifiers. homeassistant.restart is included by default so
      a full restart is never triggered without approval.

network:
  7681/tcp: Web Terminal (ttyd)
