---
name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate stable tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          config_version="$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' claudecode/config.yaml | head -n 1)"

          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2,}$ ]]; then
            echo "::error::Invalid stable tag: ${TAG}"
            exit 1
          fi
          if [ "$config_version" != "$version" ]; then
            echo "::error::Tag ${TAG} does not match claudecode/config.yaml version ${config_version:-<empty>}."
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "${TAG}^{commit}" origin/main; then
            echo "::error::Stable tag ${TAG} is not reachable from main."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' claudecode/CHANGELOG.md > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "No changelog section found for ${VERSION}." > /tmp/release-notes.md
            echo "::warning::No changelog section found for ${VERSION}."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
